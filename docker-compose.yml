version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: south_india_job_agent_db
    restart: always
    environment:
      POSTGRES_DB: south_india_job_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d south_india_job_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: south_india_job_agent_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py run_discovery &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "prod-secret-south-india-fresher-job-intelligence-agent"
      DATABASE_URL: "postgresql://postgres:postgrespassword@db:5432/south_india_job_agent"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: south_india_job_agent_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
